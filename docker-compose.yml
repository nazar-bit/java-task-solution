version: '3.8'

services:
  postgres-db:
    image: postgres:16
    environment:
      POSTGRES_DB: xml_task_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: pass
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro`
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d xml_task_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  xml-parser-app:
    build: .
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/xml_task_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: pass